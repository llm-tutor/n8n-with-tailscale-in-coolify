version: '3.8'

services:
  # Tailscale sidecar.
  #
  # Two things here are load-bearing and easy to get wrong:
  #
  #   * TS_USERSPACE=false — kernel networking. In the image's default userspace
  #     mode this namespace has NO tailscale0 interface, and only *inbound*
  #     connections work (the userspace stack proxies them to localhost, which is
  #     why a serving container like searxng is fine). Anything that shares this
  #     namespace and needs to make an OUTBOUND connection to the tailnet — the
  #     worker, the runner — gets nothing in userspace mode. Verified on the host
  #     2026-09-20: the userspace sidecar had no tailscale0 and could not reach
  #     100.82.44.116:9119; the kernel-mode sidecar (this flag) had tailscale0 and
  #     could.
  #   * /dev/net/tun must be present for kernel mode. The image can create the
  #     node itself when it holds NET_ADMIN, but mounting it makes the requirement
  #     explicit rather than dependent on that fallback.
  #
  # Tags are applied at enrolment. --advertise-tags is durability for a future
  # re-enrolment; the tag on the existing node is applied from the admin console,
  # which needs no re-authentication and does not change the node's address.
  # Routes are deliberately NOT advertised: this sidecar used to advertise the
  # VPS's private networks (10/8, 172.16/12, 192.168/16 — including the compose
  # networks holding Postgres and Redis) into the whole tailnet.
  tailscale:
    image: tailscale/tailscale:latest
    pull_policy: always
    hostname: n8n-hetzner
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_EXTRA_ARGS=--advertise-tags=tag:server
      - TS_AUTH_ONCE=true
    volumes:
      - /root/data/n8n/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    networks:
      - n8n_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - /root/data/n8n/postgres:/var/lib/postgresql/data
    networks:
      - n8n_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - /root/data/n8n/redis:/data
    networks:
      - n8n_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  n8n:
    image: n8nio/n8n:2.26.8
    user: "1000:1000"
    environment:
      # Timezone (configurable via TZ environment variable)
      - TZ=${TZ:-Etc/GMT+6}
      - GENERIC_TIMEZONE=${TZ:-Etc/GMT+6}
      # Authentication & User Management
      - N8N_USER_MANAGEMENT_ENABLED=true
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_JWT_SECRET}
      # Database
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      # Queue mode for scaling
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      # Security
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/files:/backups
      # External access
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_EDITOR_BASE_URL=${WEBHOOK_URL}
      - N8N_HOST=0.0.0.0
      - N8N_PROTOCOL=https
      - N8N_PROXY_HOPS=1
      # Performance
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=${EXECUTIONS_DATA_MAX_AGE:-168}
      - N8N_METRICS=${N8N_METRICS:-true}
      - N8N_DATA_TABLES_MAX_SIZE_BYTES=${N8N_DATA_TABLES_MAX_SIZE_BYTES:-524288000}
      # Custom nodes
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - N8N_CUSTOM_EXTENSIONS=/home/node/.n8n/custom
      # Disable telemetry
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_HIRING_BANNER_ENABLED=false
      # File permissions and modern settings
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      - N8N_BLOCK_RUNNER_ENV_ACCESS=false
      # Timeouts
      - N8N_RUNNERS_TASK_TIMEOUT=${N8N_RUNNERS_TASK_TIMEOUT:-300}
      - N8N_DEFAULT_CODE_NODE_TIMEOUT=${N8N_DEFAULT_CODE_NODE_TIMEOUT:-300}
    ports:
      - "5678:5678"
    volumes:
      - /root/data/n8n/.n8n:/home/node/.n8n
      - /root/data/n8n/custom-nodes:/home/node/.n8n/custom
      - /root/data/n8n/shared-files:/files
      - /root/data/n8n/backups:/backups
    networks:
      - n8n_network
    depends_on:
      tailscale:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  n8n-worker:
    image: n8nio/n8n:2.26.8
    user: "1000:1000"
    command: worker
    # Shares the sidecar's network namespace — this is what puts the worker on the
    # tailnet, which is what lets HTTP Request nodes reach a tailnet address.
    # A container using another's namespace cannot publish ports; this one has
    # none, so nothing is lost. It keeps resolving postgres/redis through the
    # sidecar's own bridge address on n8n_network (verified on the host).
    network_mode: "service:tailscale"
    environment:
      # Timezone (configurable via TZ environment variable)
      - TZ=${TZ:-Etc/GMT+6}
      - GENERIC_TIMEZONE=${TZ:-Etc/GMT+6}
      # Database
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_BLOCK_RUNNER_ENV_ACCESS=false
      # Timeouts
      - N8N_RUNNERS_TASK_TIMEOUT=${N8N_RUNNERS_TASK_TIMEOUT:-300}
      - N8N_DEFAULT_CODE_NODE_TIMEOUT=${N8N_DEFAULT_CODE_NODE_TIMEOUT:-300}
      # Data Tables limits
      - N8N_DATA_TABLES_MAX_SIZE_BYTES=${N8N_DATA_TABLES_MAX_SIZE_BYTES:-524288000}
    volumes:
      - /root/data/n8n/.n8n:/home/node/.n8n
      - /root/data/n8n/shared-files:/files
    depends_on:
      tailscale:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  n8n-runner:
    build:
      context: . 
      dockerfile: Dockerfile
    container_name: n8n-custom-runner
    restart: unless-stopped
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      # 127.0.0.1, not n8n-worker: the runner and the worker share the sidecar's
      # namespace, so they are the same host — and a service that shares another's
      # namespace is no longer attached to n8n_network, so its own name does not
      # resolve there.
      - N8N_RUNNERS_TASK_BROKER_URI=http://127.0.0.1:5679
      # This two could be removed (handled in runners.json). Left for reference.
      - N8N_RUNNERS_STDLIB_ALLOW=*
      - N8N_RUNNERS_EXTERNAL_ALLOW=*
      # Explicitly tell Rclone where the file is
      - RCLONE_CONFIG=/home/runner/.config/rclone/rclone.conf
      # AI API Keys
      - GOOGLE_API_KEY_FREE=${GOOGLE_API_KEY_FREE}
      - GOOGLE_API_KEY_PRO=${GOOGLE_API_KEY_PRO}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EXECUTION_DIAKEFO_STUDIO_FOLDER=${EXECUTION_DIAKEFO_STUDIO_FOLDER:-/files/diakefo_studio/}
      - N8N_BLOCK_RUNNER_ENV_ACCESS=false
      # Timeouts
      - N8N_RUNNERS_TASK_TIMEOUT=${N8N_RUNNERS_TASK_TIMEOUT:-300}
      - N8N_DEFAULT_CODE_NODE_TIMEOUT=${N8N_DEFAULT_CODE_NODE_TIMEOUT:-300}
    volumes:
      - /root/data/n8n/shared-files:/files
      # Mount the whole directory, not just the file
      - /root/data/n8n/config:/home/runner/.config/rclone
    # Shares the sidecar's namespace, like the worker: Code nodes run here, so a
    # workflow that calls the tailnet from a Code node needs it too.
    network_mode: "service:tailscale"
    depends_on:
      - n8n-worker

networks:
  n8n_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16